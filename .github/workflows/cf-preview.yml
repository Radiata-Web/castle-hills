# Deploys the long-lived `cf-preview` branch to Worker `castle-hills-preview`.
# Requires GitHub secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (Ryan adds in
# repo Settings → Secrets — never paste into chat). Until then, use dashboard
# Workers Builds or one-off `wrangler deploy` — see docs/cloudflare-preview-setup.md.
name: Cloudflare preview (cf-preview)

on:
  push:
    branches: [cf-preview]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
