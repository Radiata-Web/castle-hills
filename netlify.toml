[build]
command = "pnpm run build"
publish = "dist/client"

# Junk / mangled paths → 410 (force so edge wins before SSR)

[[redirects]]
from = "/$"
to = "/gone.html"
status = 410
force = true

[[redirects]]
from = "/&"
to = "/gone.html"
status = 410
force = true

[[redirects]]
from = "/%24"
to = "/gone.html"
status = 410
force = true

[[redirects]]
from = "/%26"
to = "/gone.html"
status = 410
force = true

