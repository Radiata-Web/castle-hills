[build]
command = "pnpm run build"
publish = "dist/client"

# --- Junk / bot-mangled paths (GSC) ---
# Prefer 410 over soft 307→home. force=true so edge wins before SSR.
# Literal "$" was returning a soft 307 to / on production; encoded %24 already 404'd.

[[redirects]]
from = "/$"
to = "/gone.html"
status = 410
force = true

[[redirects]]
from = "/&"
to = "/gone.html"
status = 410
force = true

[[redirects]]
from = "/%24"
to = "/gone.html"
status = 410
force = true

[[redirects]]
from = "/%26"
to = "/gone.html"
status = 410
force = true

# --- Umbrella retirements (Phase 2 cutover) ---
# Absolute destinations: single clean hop, absolute Location for crawlers.

[[redirects]]
from = "/luxury-finishes-coatings"
to = "https://chstainandrestoration.com/painting"
status = 301
force = true

[[redirects]]
from = "/fence-services"
to = "https://chstainandrestoration.com/wood-staining/fence"
status = 301
force = true

[[redirects]]
from = "/custom-wood-structures-outdoor-design"
to = "https://chstainandrestoration.com/wood-staining/patio-pergola"
status = 301
force = true

[[redirects]]
