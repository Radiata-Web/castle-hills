allowBuilds:
  esbuild: true
  sharp: true
# Transitive security patches. Selectors pin the current major so we don't
# float nanoid 3 → 6 or js-yaml 4 → 5.
overrides:
  sharp: "^0.35.3"
  hono: "^4.12.34"
  js-yaml@4: "4.3.1"
  nanoid@3: "3.3.18"
  vite@*: "catalog:"
  # Keep Vitest locked to the Vite+ 1.4.0 bundled runner
  # (https://viteplus.dev/guide/upgrade-project).
  vitest@*: "catalog:"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
